<header class="site-header">
  <nav class="store-nav" aria-label="Primary navigation">
    <div class="nav-left">
      <a class="brand" href="{% url 'core:home' %}" aria-label="Bazaarly home">BAZAAR<span>LY</span></a>
      <a class="contact-link" href="#contact">Contact</a>
    </div>
    <form class="catalog-search" action="{% url 'core:home' %}" method="get" role="search">
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 4.2 4.2"/></svg>
      <label class="sr-only" for="catalog-search">Search products</label>
      <input id="catalog-search" name="q" type="search" value="{{ search_query|default:'' }}" placeholder="Search products...">
    </form>
    <div class="nav-actions">
      <a class="cart-link" href="{% url 'core:order-summary' %}" aria-label="Open cart">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 4h2l2.1 10.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 1.9-1.4L21 7H6.4"/><circle cx="8.5" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg><b class="cart-count" aria-label="{{ cart_item_count }} items in cart">{{ cart_item_count }}</b>
      </a>
      {% if request.user.is_authenticated %}
        <form class="logout-form" method="post" action="{% url 'account_logout' %}">{% csrf_token %}<button class="nav-text-action" type="submit">Sign Out</button></form>
      {% else %}
        <a class="nav-text-action" href="{% url 'account_login' %}">Sign In</a>
        <a class="signup-link" href="{% url 'account_signup' %}">Sign Up</a>
      {% endif %}
    </div>
  </nav>
</header>
